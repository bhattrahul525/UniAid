# Netlify config for UniAid Frontend (Vite + React SPA)
# In Netlify: set "Base directory" to "Frontend" so this file is used.

[build]
  command = "npm run build"
  publish = "dist"

# SPA: serve index.html for all routes so client-side routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
